<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재활치료부 통합 연차 및 휴가 관리 시스템</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f4f6f9; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2 { font-size: 16px; margin: 0 0 12px 0; color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
    select, input, button { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
    button { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
    
    /* 탭 메뉴 */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .nav-tabs button { flex: 1; padding: 12px; background: #e8f0fe; color: #1a73e8; border-radius: 8px; font-weight: bold; }
    .nav-tabs button.active { background: #1a73e8; color: white; }

    /* 전체 달력 스타일 */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .calendar-header h3 { margin: 0; font-size: 16px; }
    .calendar-header button { width: auto; padding: 6px 14px; margin: 0; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-header { font-weight: bold; padding: 6px 0; font-size: 12px; text-align: center; background: #eee; border-radius: 4px; }
    .day-header.sun { color: #d93025; }
    .day-header.sat { color: #1a73e8; }
    
    .day-cell { min-height: 95px; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; }
    .day-cell.other-month { opacity: 0.3; background: #fafafa; }
    .day-cell.holiday { background-color: #fce8e6; }
    .day-cell .num { font-size: 11px; font-weight: bold; margin-bottom: 2px; }
    .day-cell.sun .num, .day-cell.holiday .num { color: #d93025; }
    .day-cell.sat .num { color: #1a73e8; }
    
    .holiday-name { font-size: 9px; color: #d93025; font-weight: bold; margin-bottom: 4px; line-height: 1; }

    /* 달력 내부 휴가 태그 */
    .leave-tag { font-size: 10px; padding: 2px 4px; border-radius: 3px; color: white; margin-bottom: 2px; line-height: 1.2; word-break: break-all; }
    .tag-annual { background-color: #d93025; }
    .tag-half { background-color: #f9ab00; }
    .tag-today { background-color: #e67c73; font-weight: bold; border: 1px dashed #fff; }
    .tag-etc { background-color: #3b78e7; }
    .tag-edu { background-color: #00897b; }
    .tag-unpaid { background-color: #5f6368; }

    /* 현황 테이블 */
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    th, td { border: 1px solid #e0e0e0; padding: 8px 4px; text-align: center; }
    th { background: #f1f3f4; color: #333; }
    .warn-text { color: #d93025; font-weight: bold; }

    /* 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 360px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

  <!-- 탭 네비게이션 -->
  <div class="nav-tabs">
    <button id="tab1Btn" class="active" onclick="switchTab(1)">📅 전체 직원 달력</button>
    <button id="tab2Btn" onclick="switchTab(2)">📊 직원별 잔여/카운팅 현황</button>
  </div>

  <div class="card">
    <h2>1. 엑셀 명부 업로드 (.xlsx)</h2>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
  </div>

  <!-- TAB 1: 전체 직원 달력 뷰 -->
  <div id="tab1View">
    <div class="card">
      <div class="calendar-header">
        <button onclick="changeMonth(-1)">◀ 이전달</button>
        <h3 id="currentMonthStr">2026년 9월</h3>
        <button onclick="changeMonth(1)">다음달 ▶</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <!-- TAB 2: 직원별 잔여 연차 & 규정 카운팅 리포트 -->
  <div id="tab2View" style="display:none;">
    <div class="card">
      <h2>전체 직원 연차 및 규정 카운팅 현황</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>소속</th>
              <th>근속년수</th>
              <th>발생연차</th>
              <th>사용연차</th>
              <th>잔여연차</th>
              <th>월금사용/한도</th>
              <th>공휴일연접</th>
              <th>장기휴가/한도</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody">
            <tr><td colspan="9">엑셀 파일을 업로드해 주세요.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 연차 등록 모달 -->
  <div class="modal" id="leaveModal">
    <div class="modal-content">
      <h3 id="modalDateStr" style="margin-top:0;">휴가 신청</h3>
      
      <label>대상 직원 선택</label>
      <select id="modalEmpSelect">
        <option value="">-- 직원을 선택하세요 --</option>
      </select>

      <label>휴가구분 선택</label>
      <select id="leaveTypeSelect">
        <optgroup label="연차 / 반차">
          <option value="연차|1.0">연차 (-1.0)</option>
          <option value="반차(AM)|0.5">반차(AM) (-0.5)</option>
          <option value="반차(PM)|0.5">반차(PM) (-0.5)</option>
        </optgroup>
        <optgroup label="교육연차 (서티: NDT, 연하, 인지)">
          <option value="교육연차|1.0">교육연차 (-1.0) 📚</option>
          <option value="교육반차(AM)|0.5">교육반차(AM) (-0.5) 📚</option>
          <option value="교육반차(PM)|0.5">교육반차(PM) (-0.5) 📚</option>
        </optgroup>
        <optgroup label="무급휴가 (만근 미달 시 월차 생성 차감)">
          <option value="무급휴가|0.0">무급휴가 (월차 미발생)</option>
          <option value="무급반차(AM)|0.0">무급반차(AM)</option>
          <option value="무급반차(PM)|0.0">무급반차(PM)</option>
        </optgroup>
        <optgroup label="당일 연차 / 당일 반차 (서류첨부 필요)">
          <option value="당일연차|1.0">당일연차 (-1.0) 📎</option>
          <option value="당일반차(AM)|0.5">당일반차(AM) (-0.5) 📎</option>
          <option value="당일반차(PM)|0.5">당일반차(PM) (-0.5) 📎</option>
        </optgroup>
        <optgroup label="종교 / 기타 반차">
          <option value="종교반차(AM)|0.5">종교반차(AM) (-0.5)</option>
          <option value="종교반차(PM)|0.5">종교반차(PM) (-0.5)</option>
        </optgroup>
        <optgroup label="예비군 / 민방위">
          <option value="예비군(종일)|0.0">예비군(종일)</option>
          <option value="예비군(AM)|0.0">예비군(AM)</option>
          <option value="예비군(PM)|0.0">예비군(PM)</option>
          <option value="예비군(기타)|0.0">예비군(기타)</option>
          <option value="민방위(AM)|0.0">민방위(AM)</option>
          <option value="민방위(PM)|0.0">민방위(PM)</option>
        </optgroup>
        <optgroup label="경조사 / 특별">
          <option value="경사|0.0">경사</option>
          <option value="조사|0.0">조사</option>
          <option value="(생)|0.0">(생)</option>
          <option value="(@)|0.0">(@)</option>
          <option value="(추)|0.0">(추)</option>
        </optgroup>
        <optgroup label="보내기">
          <option value="보내기연차|1.0">보내기연차 (-1.0)</option>
          <option value="보내기반차(AM)|0.5">보내기반차(AM) (-0.5)</option>
          <option value="보내기반차(PM)|0.5">보내기반차(PM) (-0.5)</option>
        </optgroup>
      </select>

      <div style="margin-top:12px;">
        <button onclick="submitLeave()" style="background:#1a73e8;">등록하기</button>
        <button onclick="closeModal()" style="background:#e0e0e0; color:#333;">취소</button>
      </div>
    </div>
  </div>

  <script>
    let employeeList = [];
    let leaveEvents = []; 
    let currentDate = new Date();
    let selectedDateStr = "";

    // 대한민국 주요 공휴일 데이터
    const holidays = {
      "2025-01-01": "신정", "2025-01-28": "설날연휴", "2025-01-29": "설날", "2025-01-30": "설날연휴",
      "2025-03-01": "삼일절", "2025-03-03": "대체공휴일", "2025-05-05": "어린이날/부처님오신날",
      "2025-06-06": "현충일", "2025-08-15": "광복절", "2025-10-03": "개천절", "2025-10-05": "추석연휴",
      "2025-10-06": "추석", "2025-10-07": "추석연휴", "2025-10-08": "대체공휴일", "2025-10-09": "한글날", "2025-12-25": "성탄절",
      "2026-01-01": "신정", "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
      "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날",
      "2026-05-25": "대체공휴일", "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일",
      "2026-09-24": "추석연휴", "2026-09-25": "추석", "2026-09-26": "추석연휴", "2026-10-03": "개천절",
      "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절"
    };

    document.getElementById('excelFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });
          employeeList = [];

          workbook.SheetNames.forEach(sheetName => {
            if (sheetName.includes("직원명부") || sheetName.includes("명부")) {
              const sheet = workbook.Sheets[sheetName];
              const jsonData = XLSX.utils.sheet_to_json(sheet, { range: 1 });
              jsonData.forEach(row => {
                const name = row['성명*'] || row['성명'] || row['이름'];
                let hireDate = row['입사일*'] || row['입사일'];
                if (name && hireDate && !String(name).includes('예시')) {
                  if (hireDate instanceof Date) {
                    hireDate = hireDate.toISOString().split('T')[0];
                  } else {
                    hireDate = String(hireDate).split(' ')[0];
                  }
                  employeeList.push({
                    name: String(name).trim(),
                    hireDate: String(hireDate).trim(),
                    dept: row['소속팀/파트'] || sheetName.replace('①직원명부(', '').replace(')', '')
                  });
                }
              });
            }
          });

          updateEmpDropdown();
          renderCalendar();
          renderSummaryTable();
          alert(`총 ${employeeList.length}명의 직원 명단을 불러왔습니다.`);
        } catch(err) {
          alert("엑셀 파싱 오류: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function updateEmpDropdown() {
      const select = document.getElementById('modalEmpSelect');
      select.innerHTML = '<option value="">-- 직원을 선택하세요 --</option>';
      employeeList.forEach((emp, i) => {
        const opt = document.createElement('option');
        opt.value = emp.name;
        opt.textContent = `${emp.name} (${emp.dept})`;
        select.appendChild(opt);
      });
    }

    function switchTab(tabIndex) {
      document.getElementById('tab1Btn').classList.toggle('active', tabIndex === 1);
      document.getElementById('tab2Btn').classList.toggle('active', tabIndex === 2);
      document.getElementById('tab1View').style.display = tabIndex === 1 ? 'block' : 'none';
      document.getElementById('tab2View').style.display = tabIndex === 2 ? 'block' : 'none';
      if (tabIndex === 2) renderSummaryTable();
    }

    function isHoliday(dateStr) {
      const d = new Date(dateStr);
      const day = d.getDay();
      return day === 0 || holidays[dateStr] !== undefined; // 일요일 또는 법정공휴일
    }

    function getEmployeeStats(emp) {
      const hireDate = new Date(emp.hireDate);
      const today = new Date();
      let years = today.getFullYear() - hireDate.getFullYear();
      const m = today.getMonth() - hireDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < hireDate.getDate())) years--;

      const empEvents = leaveEvents.filter(e => e.empName === emp.name).sort((a,b) => new Date(a.date) - new Date(b.date));
      
      let unpaidCount = 0;
      empEvents.forEach(e => {
        if (e.type.includes('무급휴가')) unpaidCount += 1.0;
        if (e.type.includes('무급반차')) unpaidCount += 0.5;
      });

      let totalLeave = (years < 1) ? Math.max(0, 11 - unpaidCount) : Math.min(25, 15 + Math.floor((years - 1) / 2));
      let mfLimit = totalLeave >= 17 ? 6 + (totalLeave - 17 + 1) : 6;
      let longLeaveLimit = years >= 3 ? 3 : 2; // 근속 3년 이상 3회, 미만 2회

      let usedDays = 0;
      let mfCount = 0;
      let holidayAdjCount = 0;
      let longLeaveCount = 0;

      empEvents.forEach((e, idx) => {
        if (!e.type.includes('무급')) usedDays += e.days;

        const dateObj = new Date(e.date);
        const dayOfWeek = dateObj.getDay();
        const isEdu = e.type.includes('교육');
        const isFamilyEvent = e.type.includes('경사') || e.type.includes('조사');

        // 월/금 카운팅
        if ((dayOfWeek === 1 || dayOfWeek === 5) && !isFamilyEvent && !isEdu) {
          mfCount++;
        }

        // 공휴일 연접 카운팅 (보내기연차 및 비연결 반차 제외)
        if (!e.type.includes('보내기') && !e.type.includes('반차')) {
          const prevDateStr = new Date(dateObj.getTime() - 86400000).toISOString().split('T')[0];
          const nextDateStr = new Date(dateObj.getTime() + 86400000).toISOString().split('T')[0];
          if (isHoliday(prevDateStr) || isHoliday(nextDateStr)) {
            holidayAdjCount++;
          }
        }
      });

      // 장기휴가 계산 (연속 2~5일 사용)
      let consecutiveGroup = [];
      empEvents.forEach((e) => {
        if (e.type.includes('연차') || e.type.includes('예비군')) {
          if (consecutiveGroup.length === 0) {
            consecutiveGroup.push(e);
          } else {
            const prev = new Date(consecutiveGroup[consecutiveGroup.length - 1].date);
            const curr = new Date(e.date);
            const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
            
            // 주말 포함 연속성 체크
            if (diffDays === 1 || (diffDays === 3 && (prev.getDay() === 5 && curr.getDay() === 1))) {
              consecutiveGroup.push(e);
            } else {
              evaluateLongLeave(consecutiveGroup);
              consecutiveGroup = [e];
            }
          }
        }
      });
      if (consecutiveGroup.length > 0) evaluateLongLeave(consecutiveGroup);

      function evaluateLongLeave(group) {
        if (group.length >= 2 && group.length <= 5) {
          // 예외 1: 연차 + 보내기연차 조합 제외
          const hasSend = group.some(item => item.type.includes('보내기'));
          if (hasSend) return;

          // 예외 2: 화-수, 수-목 평일 2일 제한적 사용 제외
          if (group.length === 2) {
            const d1 = new Date(group[0].date).getDay();
            const d2 = new Date(group[1].date).getDay();
            if ((d1 === 2 && d2 === 3) || (d1 === 3 && d2 === 4)) {
              return; // 장기휴가 카운팅 제외
            }
          }

          // 예비군+연차 및 주말 연접 연차는 정상 장기휴가로 카운팅
          longLeaveCount++;
        }
      }

      return {
        years: years < 0 ? 0 : years,
        totalLeave,
        usedDays,
        remainLeave: totalLeave - usedDays,
        mfCount,
        mfLimit,
        holidayAdjCount,
        longLeaveCount,
        longLeaveLimit
      };
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('currentMonthStr').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const dayHeaders = ['일', '월', '화', '수', '목', '금', '토'];
      dayHeaders.forEach((dh, i) => {
        const div = document.createElement('div');
        div.className = `day-header ${i===0?'sun':i===6?'sat':''}`;
        div.textContent = dh;
        grid.appendChild(div);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        const div = document.createElement('div');
        div.className = 'day-cell other-month';
        div.innerHTML = `<span class="num">${prevLastDate - i}</span>`;
        grid.appendChild(div);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayOfWeek = new Date(year, month, d).getDay();
        const isHoli = holidays[dateStr] !== undefined;
        
        const div = document.createElement('div');
        div.className = `day-cell ${dayOfWeek===0?'sun':dayOfWeek===6?'sat':''} ${isHoli?'holiday':''}`;
        
        let holiHtml = isHoli ? `<div class="holiday-name">${holidays[dateStr]}</div>` : '';

        let tagsHtml = '';
        const dayEvents = leaveEvents.filter(e => e.date === dateStr);
        dayEvents.forEach(e => {
          let tagClass = 'tag-annual';
          if (e.type.includes('반차')) tagClass = 'tag-half';
          if (e.type.includes('당일')) tagClass = 'tag-today';
          if (e.type.includes('보내기')) tagClass = 'tag-send';
          if (e.type.includes('교육')) tagClass = 'tag-edu';
          if (e.type.includes('무급')) tagClass = 'tag-unpaid';
          if (e.type.includes('예비군') || e.type.includes('경사')) tagClass = 'tag-etc';

          tagsHtml += `<div class="leave-tag ${tagClass}">${e.empName}: ${e.type}</div>`;
        });

        div.innerHTML = `<span class="num">${d}</span>${holiHtml}${tagsHtml}`;
        div.onclick = () => openModal(dateStr);
        grid.appendChild(div);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function renderSummaryTable() {
      const tbody = document.getElementById('summaryTableBody');
      if (employeeList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9">엑셀 파일을 업로드해 주세요.</td></tr>';
        return;
      }

      let html = '';
      employeeList.forEach(emp => {
        const stats = getEmployeeStats(emp);
        const isOverMf = stats.mfCount > stats.mfLimit;
        const isOverHoli = stats.holidayAdjCount > 1;
        const isOverLong = stats.longLeaveCount > stats.longLeaveLimit;
        
        html += `
          <tr>
            <td><strong>${emp.name}</strong></td>
            <td>${emp.dept}</td>
            <td>${stats.years}년차</td>
            <td>${stats.totalLeave}일</td>
            <td>${stats.usedDays}일</td>
            <td class="${stats.remainLeave < 0 ? 'warn-text' : ''}">${stats.remainLeave}일 ${stats.remainLeave < 0 ? '(당겨쓰기 필요/컨펌요망)' : ''}</td>
            <td class="${isOverMf ? 'warn-text' : ''}">${stats.mfCount} / ${stats.mfLimit}회</td>
            <td class="${isOverHoli ? 'warn-text' : ''}">${stats.holidayAdjCount} / 1회</td>
            <td class="${isOverLong ? 'warn-text' : ''}">${stats.longLeaveCount} / ${stats.longLeaveLimit}회</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function openModal(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('modalDateStr').textContent = `${dateStr} 휴가 등록`;
      document.getElementById('leaveModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('leaveModal').style.display = 'none';
    }

    function submitLeave() {
      const empName = document.getElementById('modalEmpSelect').value;
      const typeVal = document.getElementById('leaveTypeSelect').value;

      if (!empName) {
        alert('대상 직원을 선택하세요.');
        return;
      }

      const [type, daysStr] = typeVal.split('|');
      const days = parseFloat(daysStr);

      if (type.includes('당일')) {
        alert('⚠️ 당일 연차/반차 신청 건입니다. 증빙 서류 첨부 여부를 확인하세요.');
      }

      leaveEvents.push({
        empName,
        date: selectedDateStr,
        type,
        days
      });

      closeModal();
      renderCalendar();
      renderSummaryTable();
    }
  </script>
</body>
</html>
