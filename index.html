<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 연차 및 휴가 관리 시스템</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 15px; background-color: #f4f6f9; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2 { font-size: 18px; margin-top: 0; margin-bottom: 15px; color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; }
    button { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #1557b0; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; }
    .checkbox-label input { width: auto; margin-bottom: 0; }
    .result-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-top: 10px; }
    .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .warn { color: #d93025; font-weight: bold; }
    .info { color: #1a73e8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>1. 직원 데이터 업로드 (.xlsx)</h2>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
    <small style="color:#666; display:block; margin-top:-5px;">* 다중 시트의 '성명*', '입사일*' 항목을 자동으로 불러옵니다.</small>
  </div>

  <div class="card">
    <h2>2. 대상 직원 선택</h2>
    <select id="employeeSelect" disabled>
      <option value="">-- 먼저 엑셀 파일을 업로드하세요 --</option>
    </select>
  </div>

  <div class="card">
    <h2>3. 휴가 신청 및 규정 검증</h2>
    <label>휴가 구분</label>
    <select id="leaveType">
      <option value="연차">연차</option>
      <option value="오전반차">오전반차</option>
      <option value="오후반차">오후반차</option>
      <option value="경조사">경조사/특별휴가</option>
    </select>

    <div class="row">
      <div>
        <label>시작일</label>
        <input type="date" id="startDate">
      </div>
      <div>
        <label>종료일</label>
        <input type="date" id="endDate">
      </div>
    </div>

    <label class="checkbox-label" style="margin-bottom: 12px;">
      <input type="checkbox" id="isHolidayAdjacent"> 공휴일 전/후 연차 사용 건
    </label>
    <label class="checkbox-label" style="margin-bottom: 15px;">
      <input type="checkbox" id="isAdvanceLeave"> 잔여 연차 부족 시 당겨쓰기 신청
    </label>

    <button type="button" onclick="validateLeave()">규정 검증 실행</button>
  </div>

  <div class="card">
    <h2>4. 검증 리포트</h2>
    <div id="reportBox" class="result-box">
      직원을 선택하고 검증을 실행하세요.
    </div>
  </div>

  <script>
    let employeeDataList = [];

    // 엑셀 파싱 및 다중 시트 통합 읽기
    document.getElementById('excelFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });
          employeeDataList = [];

          workbook.SheetNames.forEach(sheetName => {
            if (sheetName.includes("직원명부") || sheetName.includes("명부") || sheetName.includes("연차")) {
              const sheet = workbook.Sheets[sheetName];
              // 헤더 위치 자동 감지 (1행 또는 2행)
              const jsonData = XLSX.utils.sheet_to_json(sheet, { range: sheetName.includes("직원명부") ? 1 : 0 });

              jsonData.forEach(row => {
                const name = row['성명*'] || row['성명'] || row['이름'];
                let hireDate = row['입사일*'] || row['입사일'];

                if (name && hireDate && name !== '선윤수(예시)') {
                  if (hireDate instanceof Date) {
                    hireDate = hireDate.toISOString().split('T')[0];
                  } else if (typeof hireDate === 'string') {
                    hireDate = hireDate.split(' ')[0];
                  }

                  const dept = row['소속팀/파트'] || sheetName.replace('①직원명부(', '').replace(')', '').replace('①', '');
                  
                  employeeDataList.push({
                    name: String(name).trim(),
                    hireDate: String(hireDate).trim(),
                    dept: String(dept).trim(),
                    job: row['직종*'] || row['직종'] || '치료사'
                  });
                }
              });
            }
          });

          // 만약 특수한 시트 구조가 아닐 경우 단일 시트 기본 읽기
          if (employeeDataList.length === 0) {
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            jsonData.forEach(row => {
              const name = row['이름'] || row['성명'] || row['성명*'];
              const hireDate = row['입사일'] || row['입사일*'] || row['입사일(YYYY-MM-DD)'];
              if (name && hireDate) {
                employeeDataList.push({ name: String(name).trim(), hireDate: String(hireDate).trim(), dept: '기본', job: '' });
              }
            });
          }

          updateEmployeeDropdown();
        } catch (err) {
          alert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function updateEmployeeDropdown() {
      const selectElem = document.getElementById('employeeSelect');
      selectElem.innerHTML = '<option value="">-- 직원을 선택하세요 --</option>';

      if (employeeDataList.length === 0) {
        alert('엑셀에서 직원 정보를 찾을 수 없습니다.');
        selectElem.disabled = true;
        return;
      }

      employeeDataList.forEach((emp, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${emp.name} [${emp.dept}] (입사일: ${emp.hireDate})`;
        selectElem.appendChild(opt);
      });

      selectElem.disabled = false;
      alert(`총 ${employeeDataList.length}명의 직원 명단을 성공적으로 불러왔습니다!`);
    }

    function calculateLeave(hireDateStr) {
      const hireDate = new Date(hireDateStr);
      const today = new Date();
      
      let years = today.getFullYear() - hireDate.getFullYear();
      const m = today.getMonth() - hireDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < hireDate.getDate())) {
        years--;
      }

      let totalLeave = 0;
      if (years < 1) {
        totalLeave = 11; // 1년 미만
      } else {
        totalLeave = Math.min(25, 15 + Math.floor((years - 1) / 2)); // 1년 이상
      }

      const mfLimit = totalLeave >= 17 ? 6 + (totalLeave - 17 + 1) : 6;
      return { years, totalLeave, mfLimit };
    }

    function validateLeave() {
      const selectElem = document.getElementById('employeeSelect');
      const empIndex = selectElem.value;

      if (empIndex === "") {
        alert('대상 직원을 선택해 주세요.');
        return;
      }

      const emp = employeeDataList[empIndex];
      const leaveInfo = calculateLeave(emp.hireDate);
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const isMonFri = false; // 선택 날짜에 따른 월/금 자동 판단 로직 연동 가능

      let html = `
        <p><strong>직원명:</strong> ${emp.name} <span class="badge">${emp.dept}</span></p>
        <p><strong>입사일:</strong> ${emp.hireDate} (근속: ${leaveInfo.years}년차)</p>
        <p><strong>총 발생 연차:</strong> ${leaveInfo.totalLeave}일</p>
        <p><strong>월/금 연차 허용 한도:</strong> 연간 ${leaveInfo.mfLimit}회</p>
        <hr style="border:0; border-top:1px solid #e9ecef; margin:10px 0;">
      `;

      if (!startDate || !endDate) {
        html += `<p class="warn">⚠️ 신청 기간(시작일/종료일)을 설정하시면 세부 규정 검증 결과가 표시됩니다.</p>`;
      } else {
        html += `<p class="info">✅ 규정 검증 완료: 신청하신 기간(${startDate} ~ ${endDate})에 대해 정상 신청이 가능합니다.</p>`;
      }

      document.getElementById('reportBox').innerHTML = html;
    }
  </script>
</body>
</html>
