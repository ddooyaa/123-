<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재활치료부 통합 연차 및 휴가 관리 시스템</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 12px; background-color: #f4f6f9; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2 { font-size: 16px; margin: 0 0 12px 0; color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
    select, input, button { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
    button { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1557b0; }
    
    /* 탭 메뉴 */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .nav-tabs button { flex: 1; padding: 12px; background: #e8f0fe; color: #1a73e8; border-radius: 8px; font-weight: bold; }
    .nav-tabs button.active { background: #1a73e8; color: white; }

    /* 대형 달력 스타일 */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .calendar-header h3 { margin: 0; font-size: 16px; }
    .calendar-header button { width: auto; padding: 6px 14px; margin: 0; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-header { font-weight: bold; padding: 8px 0; font-size: 13px; text-align: center; background: #eee; border-radius: 4px; }
    .day-header.sun { color: #d93025; }
    .day-header.sat { color: #1a73e8; }
    
    .day-cell { min-height: 120px; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; overflow-y: auto; }
    .day-cell:hover { border-color: #1a73e8; background-color: #f8faff; }
    .day-cell.other-month { opacity: 0.3; background: #fafafa; }
    .day-cell.holiday { background-color: #fce8e6; }
    .day-cell .num { font-size: 12px; font-weight: bold; margin-bottom: 2px; }
    .day-cell.sun .num, .day-cell.holiday .num { color: #d93025; }
    .day-cell.sat .num { color: #1a73e8; }
    
    .holiday-name { font-size: 10px; color: #d93025; font-weight: bold; margin-bottom: 4px; line-height: 1; }

    /* 달력 내부 휴가 태그 */
    .leave-tag { font-size: 10px; padding: 3px 5px; border-radius: 3px; color: white; margin-bottom: 3px; line-height: 1.2; word-break: break-all; }
    .tag-annual { background-color: #d93025; }
    .tag-half { background-color: #f9ab00; }
    .tag-today { background-color: #e67c73; font-weight: bold; border: 1px dashed #fff; }
    .tag-etc { background-color: #3b78e7; }
    .tag-edu { background-color: #00897b; }
    .tag-unpaid { background-color: #5f6368; }
    .tag-send { background-color: #8e24aa; }

    /* 현황 테이블 */
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    th, td { border: 1px solid #e0e0e0; padding: 8px 4px; text-align: center; }
    th { background: #f1f3f4; color: #333; }
    .warn-text { color: #d93025; font-weight: bold; }
    .half-badge { background: #e8f0fe; color: #1a73e8; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 92%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
    
    .delete-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; border: 1px solid #ddd; padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
    .delete-item .btn-group { display: flex; gap: 4px; }
    .delete-item button { width: auto; padding: 3px 8px; margin: 0; font-size: 11px; }
    .btn-edit { background: #f9ab00; }
    .btn-del { background: #d93025; }

    .checkbox-row { display: flex; gap: 12px; margin-bottom: 12px; font-size: 13px; }
    .checkbox-row label { display: flex; align-items: center; gap: 4px; font-weight: normal; margin: 0; cursor: pointer; }
    .checkbox-row input { width: auto; margin: 0; }
    
    .adj-box { background: #f8f9fa; border: 1px dashed #1a73e8; border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 12px; }
    
    /* 자사 알림 모달 */
    .notice-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 2000; }
    .notice-content { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; }
  </style>
</head>
<body>

  <!-- 탭 네비게이션 -->
  <div class="nav-tabs">
    <button id="tab1Btn" class="active" onclick="switchTab(1)">📅 전체 직원 달력</button>
    <button id="tab2Btn" onclick="switchTab(2)">📊 직원별 잔여/카운팅 현황</button>
  </div>

  <div class="card">
    <h2>1. 엑셀 명부 업로드 (.xlsx)</h2>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
  </div>

  <!-- TAB 1: 전체 직원 달력 뷰 -->
  <div id="tab1View">
    <div class="card">
      <div class="calendar-header">
        <button onclick="changeMonth(-1)">◀ 이전달</button>
        <h3 id="currentMonthStr">2026년 9월</h3>
        <button onclick="changeMonth(1)">다음달 ▶</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <!-- TAB 2: 직원별 잔여 연차 & 규정 카운팅 리포트 -->
  <div id="tab2View" style="display:none;">
    <div class="card">
      <h2>전체 직원 연차 및 규정 카운팅 현황</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>소속</th>
              <th>근속년수</th>
              <th>발생연차</th>
              <th>사용연차</th>
              <th>잔여연차 (반차개수)</th>
              <th>반차 사용</th>
              <th>월금사용/한도</th>
              <th>공휴일연접</th>
              <th>장기휴가/한도</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody">
            <tr><td colspan="10">엑셀 파일을 업로드해 주세요.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 연차 등록 및 수정/삭제 모달 -->
  <div class="modal" id="leaveModal">
    <div class="modal-content">
      <h3 id="modalDateStr" style="margin-top:0;">휴가 관리</h3>

      <!-- 등록된 휴가 목록 및 수정/삭제 -->
      <div id="existingLeavesBox" style="margin-bottom: 12px;"></div>
      
      <hr style="border:0; border-top:1px solid #eee; margin:12px 0;">
      <h4 id="formTitleStr" style="margin:0 0 8px 0; font-size:14px; color:#1a73e8;">신규 휴가 등록 (기간 선택 가능)</h4>

      <!-- 직원 검색 및 선택 -->
      <label style="font-size:12px; font-weight:bold;">대상 직원 검색 및 선택</label>
      <input type="text" id="empSearchInput" placeholder="이름 또는 부서 검색..." oninput="filterEmployees()" style="margin-bottom:4px;">
      <select id="modalEmpSelect" size="3" style="height:75px; margin-bottom:8px;" onchange="onEmpSelectChange()">
        <option value="">-- 선택하세요 --</option>
      </select>

      <!-- 선택된 직원 연차 및 반차 요약 카드 -->
      <div id="empSummaryBadge" style="display:none; font-size:11px; background:#e8f0fe; color:#1a73e8; padding:8px; border-radius:6px; margin-bottom:8px; font-weight:bold;"></div>

      <!-- 직원별 월/금 조정 횟수 입력 박스 -->
      <div class="adj-box" id="adjBox" style="display:none;">
        <label style="margin-bottom:4px; font-weight:bold; color:#1a73e8; display:block;">⚙️ 직원 월/금 한도 수동 조정</label>
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:11px; color:#666;">추가/차감 횟수:</span>
          <input type="number" id="mfAdjInput" value="0" placeholder="예: +1, -1" style="margin:0; padding:4px 8px; width:80px;" onchange="saveMfAdj()">
          <span style="font-size:11px; color:#888;">(당겨쓰기 -1, 추가부여 +1 등)</span>
        </div>
      </div>

      <!-- 기간 설정 (시작일 ~ 종료일) -->
      <div id="dateRangeBox" style="margin-bottom:8px;">
        <div style="display:flex; gap:8px;">
          <div style="flex:1;">
            <label style="font-size:11px; font-weight:bold;">시작일</label>
            <input type="date" id="leaveStartDate" style="margin-bottom:4px;">
          </div>
          <div style="flex:1;">
            <label style="font-size:11px; font-weight:bold;">종료일</label>
            <input type="date" id="leaveEndDate" style="margin-bottom:4px;">
          </div>
        </div>
        <label style="font-size:12px; cursor:pointer;"><input type="checkbox" id="skipWeekendChk" checked style="width:auto;"> 🚫 주말(토/일)은 자동 제외하고 등록</label>
      </div>

      <label style="font-size:12px; font-weight:bold;">휴가구분 선택</label>
      <select id="leaveTypeSelect">
        <optgroup label="연차 / 반차">
          <option value="연차|1.0">연차 (-1.0)</option>
          <option value="반차(AM)|0.5">반차(AM) (-0.5)</option>
          <option value="반차(PM)|0.5">반차(PM) (-0.5)</option>
        </optgroup>
        <optgroup label="당일 연차 / 당일 반차 (서류첨부 필요)">
          <option value="당일연차|1.0">당일연차 (-1.0) 📎</option>
          <option value="당일반차(AM)|0.5">당일반차(AM) (-0.5) 📎</option>
          <option value="당일반차(PM)|0.5">당일반차(PM) (-0.5) 📎</option>
        </optgroup>
        <optgroup label="공가 / 모공">
          <option value="모공|0.0">모공</option>
          <option value="공가(종일)|0.0">공가(종일)</option>
          <option value="공가(AM)|0.0">공가(AM)</option>
          <option value="공가(PM)|0.0">공가(PM)</option>
        </optgroup>
        <optgroup label="교육연차 (서티: NDT, 연하, 인지)">
          <option value="교육연차|1.0">교육연차 (-1.0) 📚</option>
        </optgroup>
        <optgroup label="무급휴가 (월차 미발생)">
          <option value="무급휴가|0.0">무급휴가</option>
          <option value="무급반차(AM)|0.0">무급반차(AM)</option>
          <option value="무급반차(PM)|0.0">무급반차(PM)</option>
        </optgroup>
        <optgroup label="종교 반차">
          <option value="종교반차(AM)|0.5">종교반차(AM) (-0.5)</option>
          <option value="종교반차(PM)|0.5">종교반차(PM) (-0.5)</option>
        </optgroup>
        <optgroup label="예비군 / 민방위 (장기휴가 제외)">
          <option value="예비군(종일)|0.0">예비군(종일)</option>
          <option value="예비군(AM)|0.0">예비군(AM)</option>
          <option value="예비군(PM)|0.0">예비군(PM)</option>
          <option value="예비군(기타)|0.0">예비군(기타)</option>
          <option value="민방위(AM)|0.0">민방위(AM)</option>
          <option value="민방위(PM)|0.0">민방위(PM)</option>
        </optgroup>
        <optgroup label="경조사 / Special">
          <option value="경사|0.0">경사</option>
          <option value="조사|0.0">조사</option>
          <option value="(생)|0.0">(생)</option>
          <option value="(@)|0.0">(@)</option>
          <option value="(추)|0.0">(추)</option>
        </optgroup>
        <optgroup label="보내기">
          <option value="보내기연차|1.0">보내기연차 (-1.0)</option>
          <option value="보내기반차(AM)|0.5">보내기반차(AM) (-0.5)</option>
          <option value="보내기반차(PM)|0.5">보내기반차(PM) (-0.5)</option>
        </optgroup>
      </select>

      <div class="checkbox-row">
        <label><input type="checkbox" id="excludeMfChk"> ☑️ 월/금 제외</label>
        <label><input type="checkbox" id="excludeHoliChk"> ☑️ 공휴일 제외</label>
      </div>

      <div>
        <button id="submitBtn" onclick="submitLeave()" style="background:#1a73e8;">등록하기</button>
        <button onclick="closeModal()" style="background:#e0e0e0; color:#333;">취소</button>
      </div>
    </div>
  </div>

  <!-- 커스텀 알림 모달 -->
  <div class="notice-modal" id="noticeModal">
    <div class="notice-content">
      <h3 id="noticeTitle" style="margin-top:0; color:#1a73e8;">알림</h3>
      <p id="noticeMessage" style="font-size:13px; line-height:1.5; white-space:pre-line; color:#333; margin:16px 0;"></p>
      <button onclick="closeNotice()" style="width:100px; margin-bottom:0;">확인</button>
    </div>
  </div>

  <script>
    let employeeList = [];
    let leaveEvents = []; 
    let currentDate = new Date();
    let selectedDateStr = "";
    let editingEventId = null; // 수정 중인 휴가 항목 ID

    const holidays = {
      "2025-01-01": "신정", "2025-01-28": "설날연휴", "2025-01-29": "설날", "2025-01-30": "설날연휴",
      "2025-03-01": "삼일절", "2025-03-03": "대체공휴일", "2025-05-05": "어린이날",
      "2025-06-06": "현충일", "2025-08-15": "광복절", "2025-10-03": "개천절", "2025-10-05": "추석연휴",
      "2025-10-06": "추석", "2025-10-07": "추석연휴", "2025-10-08": "대체공휴일", "2025-10-09": "한글날", "2025-12-25": "성탄절",
      "2026-01-01": "신정", "2026-02-16": "설날연휴", "2026-02-17": "설날", "2026-02-18": "설날연휴",
      "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날",
      "2026-05-25": "대체공휴일", "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-08-17": "대체공휴일",
      "2026-09-24": "추석연휴", "2026-09-25": "추석", "2026-09-26": "추석연휴", "2026-10-03": "개천절",
      "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절"
    };

    function showNotice(msg, title = "알림") {
      document.getElementById('noticeTitle').textContent = title;
      document.getElementById('noticeMessage').textContent = msg;
      document.getElementById('noticeModal').style.display = 'flex';
    }

    function closeNotice() {
      document.getElementById('noticeModal').style.display = 'none';
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });
          employeeList = [];

          workbook.SheetNames.forEach(sheetName => {
            if (sheetName.includes("직원명부") || sheetName.includes("명부")) {
              const sheet = workbook.Sheets[sheetName];
              const jsonData = XLSX.utils.sheet_to_json(sheet, { range: 1 });
              jsonData.forEach(row => {
                const name = row['성명*'] || row['성명'] || row['이름'];
                let hireDate = row['입사일*'] || row['입사일'];
                if (name && hireDate && !String(name).includes('예시')) {
                  if (hireDate instanceof Date) {
                    hireDate = hireDate.toISOString().split('T')[0];
                  } else {
                    hireDate = String(hireDate).split(' ')[0];
                  }
                  employeeList.push({
                    name: String(name).trim(),
                    hireDate: String(hireDate).trim(),
                    dept: row['소속팀/파트'] || sheetName.replace('①직원명부(', '').replace(')', ''),
                    mfAdj: 0 // 월/금 한도 수동 조정치 (+/-)
                  });
                }
              });
            }
          });

          updateEmpDropdown();
          renderCalendar();
          renderSummaryTable();
          showNotice(`총 ${employeeList.length}명의 직원 명단을 불러왔습니다.`, "업로드 완료");
        } catch(err) {
          showNotice("엑셀 파싱 오류: " + err.message, "오류");
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function filterEmployees() {
      const keyword = document.getElementById('empSearchInput').value.trim().toLowerCase();
      const select = document.getElementById('modalEmpSelect');
      select.innerHTML = '';

      const filtered = employeeList.filter(emp => 
        emp.name.toLowerCase().includes(keyword) || emp.dept.toLowerCase().includes(keyword)
      );

      if (filtered.length === 0) {
        select.innerHTML = '<option value="">검색 결과가 없습니다</option>';
        document.getElementById('adjBox').style.display = 'none';
        document.getElementById('empSummaryBadge').style.display = 'none';
        return;
      }

      filtered.forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp.name;
        opt.textContent = `${emp.name} (${emp.dept})`;
        select.appendChild(opt);
      });
    }

    function updateEmpDropdown() {
      document.getElementById('empSearchInput').value = '';
      filterEmployees();
    }

    function onEmpSelectChange() {
      const empName = document.getElementById('modalEmpSelect').value;
      const empObj = employeeList.find(e => e.name === empName);
      const adjBox = document.getElementById('adjBox');
      const badge = document.getElementById('empSummaryBadge');

      if (empObj) {
        adjBox.style.display = 'block';
        document.getElementById('mfAdjInput').value = empObj.mfAdj || 0;
        
        const stats = getEmployeeStats(empObj);
        badge.style.display = 'block';
        badge.innerHTML = `👤 ${empObj.name} | 잔여: ${stats.remainLeave}일 (반차 ${stats.remainHalfDays}개) | 반차사용: ${stats.usedHalfDays}회`;
      } else {
        adjBox.style.display = 'none';
        badge.style.display = 'none';
      }
    }

    function saveMfAdj() {
      const empName = document.getElementById('modalEmpSelect').value;
      const empObj = employeeList.find(e => e.name === empName);
      if (empObj) {
        empObj.mfAdj = parseInt(document.getElementById('mfAdjInput').value) || 0;
        onEmpSelectChange();
        renderSummaryTable();
      }
    }

    function switchTab(tabIndex) {
      document.getElementById('tab1Btn').classList.toggle('active', tabIndex === 1);
      document.getElementById('tab2Btn').classList.toggle('active', tabIndex === 2);
      document.getElementById('tab1View').style.display = tabIndex === 1 ? 'block' : 'none';
      document.getElementById('tab2View').style.display = tabIndex === 2 ? 'block' : 'none';
      if (tabIndex === 2) renderSummaryTable();
    }

    function isHoliday(dateStr) {
      const d = new Date(dateStr);
      return d.getDay() === 0 || holidays[dateStr] !== undefined;
    }

    // 주말(토/일)이 아닌 순수 평일 공휴일 여부 판단
    function isWeekdayHoliday(dateStr) {
      const d = new Date(dateStr);
      const day = d.getDay();
      return day !== 0 && day !== 6 && holidays[dateStr] !== undefined;
    }

    function getEmployeeStats(emp) {
      const hireDate = new Date(emp.hireDate);
      const today = new Date();
      let years = today.getFullYear() - hireDate.getFullYear();
      const m = today.getMonth() - hireDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < hireDate.getDate())) years--;

      const empEvents = leaveEvents.filter(e => e.empName === emp.name).sort((a,b) => new Date(a.date) - new Date(b.date));
      
      let unpaidCount = 0;
      let usedHalfDays = 0; // 반차 사용 횟수 (개별 반차 건수)

      empEvents.forEach(e => {
        if (e.type.includes('무급휴가')) unpaidCount += 1.0;
        if (e.type.includes('무급반차')) unpaidCount += 0.5;

        if (e.type.includes('반차')) {
          usedHalfDays++;
        }
      });

      let totalLeave = (years < 1) ? Math.max(0, 11 - unpaidCount) : Math.min(25, 15 + Math.floor((years - 1) / 2));
      
      // 월/금 한도 = 기본 한도 (6 + 5년차 이상 추가) + 수동 조정치 (+/-)
      let baseMfLimit = totalLeave >= 17 ? 6 + (totalLeave - 17 + 1) : 6;
      let mfLimit = baseMfLimit + (emp.mfAdj || 0);
      let longLeaveLimit = years >= 3 ? 3 : 2;

      let usedDays = 0;

      // 1. 연속된 연차 기간을 블록화하여 월/금 카운팅 (연속 사용 시 1회 카운팅)
      let mfCount = 0;
      let mfBlocks = [];
      let currentMfBlock = [];

      empEvents.forEach((e) => {
        if (!e.type.includes('무급') && !e.type.includes('공가') && !e.type.includes('모공')) usedDays += e.days;

        // 월/금 카운팅 제외 대상 식별 (모공은 제외 대상에 미포함되어 기본적으로 카운팅에 포함됨)
        const isExemptType = e.type.includes('경사') || e.type.includes('조사') || e.type.includes('(생)') || e.type.includes('(추)') || e.type.includes('보내기') || e.type.includes('교육') || (e.type.includes('공가') && !e.type.includes('모공')) || e.type.includes('종교');

        if (e.excludeMf || isExemptType) return;

        const dateObj = new Date(e.date);
        const dayOfWeek = dateObj.getDay();

        let isUnconnectedHalf = false;
        if (e.type.includes('반차')) {
          if (dayOfWeek === 5 && e.type.includes('AM')) isUnconnectedHalf = true;
          if (dayOfWeek === 1 && e.type.includes('PM')) isUnconnectedHalf = true;
        }

        if (isUnconnectedHalf) return;

        // 연속 휴가 블록화 (하루 차이 또는 주말을 낀 금->월 연속 휴가)
        if (currentMfBlock.length === 0) {
          currentMfBlock.push(e);
        } else {
          const prevDate = new Date(currentMfBlock[currentMfBlock.length - 1].date);
          const currDate = new Date(e.date);
          const diffDays = (currDate - prevDate) / (1000 * 60 * 60 * 24);

          if (diffDays === 1 || (diffDays === 3 && prevDate.getDay() === 5 && currDate.getDay() === 1)) {
            currentMfBlock.push(e);
          } else {
            mfBlocks.push(currentMfBlock);
            currentMfBlock = [e];
          }
        }
      });
      if (currentMfBlock.length > 0) mfBlocks.push(currentMfBlock);

      // 형성된 각 연속 휴가 블록에 월요일 또는 금요일이 포함되어 있다면 1회 카운팅
      mfBlocks.forEach(block => {
        const hasMonOrFri = block.some(item => {
          const day = new Date(item.date).getDay();
          return day === 1 || day === 5;
        });
        if (hasMonOrFri) {
          mfCount++;
        }
      });

      // 2. 공휴일 연접 단일 카운팅 (주말 공휴일은 제외하고 순수 평일 공휴일에만 연접 시 카운팅)
      let holidayAdjCount = 0;
      let leaveBlocks = [];
      let currentBlock = [];

      empEvents.forEach(e => {
        if (e.excludeHoli || e.type.includes('보내기') || (e.type.includes('반차') && !e.type.includes('종교')) || e.type.includes('경사') || e.type.includes('조사') || e.type.includes('(생)') || e.type.includes('(추)') || (e.type.includes('공가') && !e.type.includes('모공'))) return;

        if (currentBlock.length === 0) {
          currentBlock.push(e);
        } else {
          const prevDate = new Date(currentBlock[currentBlock.length - 1].date);
          const currDate = new Date(e.date);
          const diffDays = (currDate - prevDate) / (1000 * 60 * 60 * 24);

          if (diffDays === 1 || diffDays <= 4) { 
            currentBlock.push(e);
          } else {
            leaveBlocks.push(currentBlock);
            currentBlock = [e];
          }
        }
      });
      if (currentBlock.length > 0) leaveBlocks.push(currentBlock);

      leaveBlocks.forEach(block => {
        let isBlockAdjacentToHoliday = false;
        block.forEach(e => {
          const dateObj = new Date(e.date);
          const prevDateStr = new Date(dateObj.getTime() - 86400000).toISOString().split('T')[0];
          const nextDateStr = new Date(dateObj.getTime() + 86400000).toISOString().split('T')[0];
          
          // 토/일 주말 공휴일은 인접 판단에서 제외하고, 순수 평일 공휴일(isWeekdayHoliday)인 경우에만 연접 카운팅
          if (isWeekdayHoliday(e.date) || isWeekdayHoliday(prevDateStr) || isWeekdayHoliday(nextDateStr)) {
            isBlockAdjacentToHoliday = true;
          }
        });
        if (isBlockAdjacentToHoliday) {
          holidayAdjCount++;
        }
      });

      // 장기휴가 계산
      let longLeaveCount = 0;
      let consecutiveGroup = [];
      empEvents.forEach((e) => {
        const isLongTarget = e.type.includes('연차') || e.type.includes('당일') || e.type.includes('예비군') || e.type.includes('무급') || e.type.includes('경사') || e.type.includes('조사') || e.type.includes('모공');
        if (isLongTarget && !e.type.includes('보내기')) {
          if (consecutiveGroup.length === 0) {
            consecutiveGroup.push(e);
          } else {
            const prev = new Date(consecutiveGroup[consecutiveGroup.length - 1].date);
            const curr = new Date(e.date);
            const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
            
            if (diffDays === 1 || (diffDays === 3 && (prev.getDay() === 5 && curr.getDay() === 1))) {
              consecutiveGroup.push(e);
            } else {
              if (evaluateLongLeave(consecutiveGroup)) longLeaveCount++;
              consecutiveGroup = [e];
            }
          }
        }
      });
      if (consecutiveGroup.length > 0 && evaluateLongLeave(consecutiveGroup)) longLeaveCount++;

      function evaluateLongLeave(group) {
        if (group.length >= 2 && group.length <= 5) {
          if (group.every(item => item.type.includes('보내기'))) return false;
          if (group.every(item => item.type.includes('예비군'))) return false;

          if (group.length === 2) {
            const d1 = new Date(group[0].date).getDay();
            const d2 = new Date(group[1].date).getDay();
            if ((d1 === 2 && d2 === 3) || (d1 === 3 && d2 === 4)) return false;
          }
          return true;
        }
        return false;
      }

      const remainLeave = totalLeave - usedDays;
      const remainHalfDays = Math.round(remainLeave * 2);

      return {
        years: years < 0 ? 0 : years,
        totalLeave,
        usedDays,
        remainLeave,
        remainHalfDays,
        usedHalfDays,
        mfCount,
        mfLimit,
        holidayAdjCount,
        longLeaveCount,
        longLeaveLimit
      };
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('currentMonthStr').textContent = `${year}년 ${month + 1}월`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const dayHeaders = ['일', '월', '화', '수', '목', '금', '토'];
      dayHeaders.forEach((dh, i) => {
        const div = document.createElement('div');
        div.className = `day-header ${i===0?'sun':i===6?'sat':''}`;
        div.textContent = dh;
        grid.appendChild(div);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        const div = document.createElement('div');
        div.className = 'day-cell other-month';
        div.innerHTML = `<span class="num">${prevLastDate - i}</span>`;
        grid.appendChild(div);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayOfWeek = new Date(year, month, d).getDay();
        const isHoli = holidays[dateStr] !== undefined;
        
        const div = document.createElement('div');
        div.className = `day-cell ${dayOfWeek===0?'sun':dayOfWeek===6?'sat':''} ${isHoli?'holiday':''}`;
        
        let holiHtml = isHoli ? `<div class="holiday-name">${holidays[dateStr]}</div>` : '';

        let tagsHtml = '';
        const dayEvents = leaveEvents.filter(e => e.date === dateStr);
        dayEvents.forEach(e => {
          let tagClass = 'tag-annual';
          if (e.type.includes('반차')) tagClass = 'tag-half';
          if (e.type.includes('당일')) tagClass = 'tag-today';
          if (e.type.includes('보내기')) tagClass = 'tag-send';
          if (e.type.includes('교육')) tagClass = 'tag-edu';
          if (e.type.includes('무급')) tagClass = 'tag-unpaid';
          if (e.type.includes('예비군') || e.type.includes('경사') || e.type.includes('공가')) tagClass = 'tag-etc';

          tagsHtml += `<div class="leave-tag ${tagClass}">${e.empName}: ${e.type}</div>`;
        });

        div.innerHTML = `<span class="num">${d}</span>${holiHtml}${tagsHtml}`;
        div.onclick = () => openModal(dateStr);
        grid.appendChild(div);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function renderSummaryTable() {
      const tbody = document.getElementById('summaryTableBody');
      if (employeeList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10">엑셀 파일을 업로드해 주세요.</td></tr>';
        return;
      }

      let html = '';
      employeeList.forEach(emp => {
        const stats = getEmployeeStats(emp);
        const isOverMf = stats.mfCount > stats.mfLimit;
        const isOverHoli = stats.holidayAdjCount > 1;
        const isOverLong = stats.longLeaveCount > stats.longLeaveLimit;
        
        html += `
          <tr>
            <td><strong>${emp.name}</strong></td>
            <td>${emp.dept}</td>
            <td>${stats.years}년차</td>
            <td>${stats.totalLeave}일</td>
            <td>${stats.usedDays}일</td>
            <td class="${stats.remainLeave < 0 ? 'warn-text' : ''}">
              ${stats.remainLeave}일 <span class="half-badge">(반차 ${stats.remainHalfDays}개)</span>
              ${stats.remainLeave < 0 ? '<br><span style="font-size:10px;" class="warn-text">(당겨쓰기/컨펌요망)</span>' : ''}
            </td>
            <td>${stats.usedHalfDays}회</td>
            <td class="${isOverMf ? 'warn-text' : ''}">
              ${stats.mfCount} / ${stats.mfLimit}회
              ${isOverMf ? '<br><span class="warn-text">(횟수오버 확인필요)</span>' : ''}
            </td>
            <td class="${isOverHoli ? 'warn-text' : ''}">
              ${stats.holidayAdjCount} / 1회
              ${isOverHoli ? '<br><span class="warn-text">(횟수오버 확인필요)</span>' : ''}
            </td>
            <td class="${isOverLong ? 'warn-text' : ''}">
              ${stats.longLeaveCount} / ${stats.longLeaveLimit}회
              ${isOverLong ? '<br><span class="warn-text">(횟수오버 확인필요)</span>' : ''}
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    function openModal(dateStr) {
      selectedDateStr = dateStr;
      editingEventId = null; // 초기화
      
      document.getElementById('modalDateStr').textContent = `${dateStr} 휴가 관리`;
      document.getElementById('formTitleStr').textContent = '신규 휴가 등록 (기간 선택 가능)';
      document.getElementById('submitBtn').textContent = '등록하기';
      document.getElementById('submitBtn').style.background = '#1a73e8';
      document.getElementById('dateRangeBox').style.display = 'block';

      // 시작일/종료일 기본 설정
      document.getElementById('leaveStartDate').value = dateStr;
      document.getElementById('leaveEndDate').value = dateStr;

      renderExistingLeavesInModal();
      updateEmpDropdown();

      document.getElementById('excludeMfChk').checked = false;
      document.getElementById('excludeHoliChk').checked = false;
      document.getElementById('empSummaryBadge').style.display = 'none';
      document.getElementById('leaveModal').style.display = 'flex';
    }

    function renderExistingLeavesInModal() {
      const existingBox = document.getElementById('existingLeavesBox');
      const dayEvents = leaveEvents.filter(e => e.date === selectedDateStr);
      
      if (dayEvents.length === 0) {
        existingBox.innerHTML = '<p style="font-size:12px; color:#888; margin:0;">이 날짜에 등록된 휴가가 없습니다.</p>';
      } else {
        let html = '<p style="font-size:12px; font-weight:bold; margin:0 0 6px 0;">등록된 휴가 목록:</p>';
        dayEvents.forEach(e => {
          html += `
            <div class="delete-item">
              <span><strong>${e.empName}</strong>: ${e.type}</span>
              <div class="btn-group">
                <button class="btn-edit" onclick="startEditLeave(${e.id})">수정</button>
                <button class="btn-del" onclick="deleteLeave(${e.id})">삭제</button>
              </div>
            </div>
          `;
        });
        existingBox.innerHTML = html;
      }
    }

    function startEditLeave(id) {
      const targetEvent = leaveEvents.find(e => e.id === id);
      if (!targetEvent) return;

      editingEventId = id;
      document.getElementById('formTitleStr').textContent = `✏️ '${targetEvent.empName}' 휴가 정보 수정`;
      document.getElementById('submitBtn').textContent = '수정 저장';
      document.getElementById('submitBtn').style.background = '#f9ab00';
      document.getElementById('dateRangeBox').style.display = 'none'; // 수정 시 단일 날짜로 수정

      // 직원 선택
      document.getElementById('empSearchInput').value = targetEvent.empName;
      filterEmployees();
      document.getElementById('modalEmpSelect').value = targetEvent.empName;
      onEmpSelectChange();

      // 휴가구분 선택
      const typeSelect = document.getElementById('leaveTypeSelect');
      for (let i = 0; i < typeSelect.options.length; i++) {
        if (typeSelect.options[i].value.startsWith(targetEvent.type + '|')) {
          typeSelect.selectedIndex = i;
          break;
        }
      }

      document.getElementById('excludeMfChk').checked = targetEvent.excludeMf || false;
      document.getElementById('excludeHoliChk').checked = targetEvent.excludeHoli || false;
    }

    function closeModal() {
      document.getElementById('leaveModal').style.display = 'none';
    }

    function submitLeave() {
      const empName = document.getElementById('modalEmpSelect').value;
      const typeVal = document.getElementById('leaveTypeSelect').value;
      const excludeMf = document.getElementById('excludeMfChk').checked;
      const excludeHoli = document.getElementById('excludeHoliChk').checked;

      if (!empName) {
        showNotice('대상 직원을 검색 후 선택해 주세요.', '경고');
        return;
      }

      const [type, daysStr] = typeVal.split('|');
      const days = parseFloat(daysStr);

      const empObj = employeeList.find(e => e.name === empName);

      // 수정 모드인 경우
      if (editingEventId !== null) {
        const targetEvent = leaveEvents.find(e => e.id === editingEventId);
        if (targetEvent) {
          targetEvent.empName = empName;
          targetEvent.type = type;
          targetEvent.days = days;
          targetEvent.excludeMf = excludeMf;
          targetEvent.excludeHoli = excludeHoli;
        }

        editingEventId = null;
        renderExistingLeavesInModal();
        renderCalendar();
        renderSummaryTable();
        showNotice('휴가 정보가 수정되었습니다.', '수정 완료');
        return;
      }

      // 신규 등록 모드 (기간 선택 포함)
      const startDateStr = document.getElementById('leaveStartDate').value;
      const endDateStr = document.getElementById('leaveEndDate').value;
      const skipWeekend = document.getElementById('skipWeekendChk').checked;

      if (!startDateStr || !endDateStr) {
        showNotice('시작일과 종료일을 바르게 지정하세요.', '경고');
        return;
      }

      let start = new Date(startDateStr);
      let end = new Date(endDateStr);

      if (start > end) {
        showNotice('시작일은 종료일보다 이전이어야 합니다.', '경고');
        return;
      }

      let addedDates = [];
      let curr = new Date(start);
      const isUnpaid = type.includes('무급');

      while (curr <= end) {
        const dayOfWeek = curr.getDay();
        const formattedDate = curr.toISOString().split('T')[0];

        // 무급휴가가 아닌 모든 연차구분은 주말(토/일)을 무조건 제외하고 등록
        if (!isUnpaid) {
          if (dayOfWeek !== 0 && dayOfWeek !== 6) {
            addedDates.push(formattedDate);
          }
        } else {
          if (!skipWeekend || (dayOfWeek !== 0 && dayOfWeek !== 6)) {
            addedDates.push(formattedDate);
          }
        }
        curr.setDate(curr.getDate() + 1);
      }

      if (addedDates.length === 0) {
        showNotice('등록 가능한 날짜가 없습니다. (주말은 자동 제외됩니다)', '경고');
        return;
      }

      // 사전 한도 및 규정 검수
      const preStats = getEmployeeStats(empObj);
      let totalReqDays = days * addedDates.length;
      let warnings = [];

      if (preStats.remainLeave - totalReqDays < 0 && !type.includes('무급') && !type.includes('공가')) {
        warnings.push('⚠️ [잔여 연차 부족] 이번 신청으로 당겨쓰기가 발생합니다. (과장님 컨펌 필요)');
      }

      addedDates.forEach(d => {
        leaveEvents.push({
          id: Date.now() + Math.random(),
          empName,
          date: d,
          type,
          days,
          excludeMf,
          excludeHoli
        });
      });

      // 등록 후 한도 초과 여부 확인 (신규 신청으로 인해 카운트가 실제로 증가한 경우에만 알림 발생)
      const postStats = getEmployeeStats(empObj);
      if (postStats.mfCount > preStats.mfCount && postStats.mfCount > postStats.mfLimit) {
        warnings.push('⚠️ [월/금 한도 초과] 횟수오버 확인필요');
      }
      if (postStats.holidayAdjCount > preStats.holidayAdjCount && postStats.holidayAdjCount > 1) {
        warnings.push('⚠️ [공휴일 연접 초과] 횟수오버 확인필요');
      }
      if (postStats.longLeaveCount > preStats.longLeaveCount && postStats.longLeaveCount > postStats.longLeaveLimit) {
        warnings.push('⚠️ [장기휴가 한도 초과] 횟수오버 확인필요');
      }

      if (warnings.length > 0) {
        showNotice('확인이 필요한 항목이 있습니다:\n\n' + warnings.join('\n'), '주의 안내');
      } else if (type.includes('당일')) {
        showNotice('⚠️ 당일 연차/반차 신청 건입니다. 증빙 서류 첨부 여부를 확인하세요.', '서류 안내');
      }

      closeModal();
      renderCalendar();
      renderSummaryTable();
    }

    function deleteLeave(id) {
      leaveEvents = leaveEvents.filter(e => e.id !== id);
      renderExistingLeavesInModal();
      renderCalendar();
      renderSummaryTable();
    }
  </script>
